<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TalePickle - Aesop's Fable-Ball Pinball Machine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background: #020617;
      user-select: none;
      overflow-x: hidden;
    }
    h1, h2, h3, h4, button, .font-fun {
      font-family: 'Fredoka', 'Nunito', sans-serif;
    }
    .clay-btn {
      box-shadow: 0 6px 0 rgba(0,0,0,0.5), 0 10px 15px rgba(0,0,0,0.3);
      transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .clay-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.5), 0 4px 6px rgba(0,0,0,0.2);
    }
    .pinball-table {
      border: 12px solid #6366F1;
      box-shadow: 0 0 50px rgba(99, 102, 241, 0.4), inset 0 0 40px rgba(0,0,0,0.9);
      background: radial-gradient(circle at 50% 30%, #312E81 0%, #1E1B4B 50%, #0F172A 100%);
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 p-3 sm:p-6 flex flex-col justify-between">

  <div class="max-w-4xl mx-auto w-full space-y-6">

    <!-- Top Pinball Header -->
    <header class="bg-slate-900/95 backdrop-blur-md px-5 py-3 rounded-3xl border-3 border-indigo-500 shadow-2xl flex items-center justify-between flex-wrap gap-3">
      <div class="flex items-center gap-3">
        <a href="redesigns.html" class="clay-btn bg-slate-800 hover:bg-slate-700 text-indigo-300 text-xs font-black px-3.5 py-2 rounded-2xl flex items-center gap-1.5 font-fun">
          <span>← Hub</span>
        </a>
        <div class="flex items-center gap-2">
          <span class="text-3xl">🎰💥</span>
          <div>
            <h1 class="text-xl sm:text-2xl font-black text-indigo-300 font-fun leading-tight">Aesop's Fable-Ball Pinball</h1>
            <p class="text-[11px] text-indigo-200 font-semibold">Pull the plunger to bounce off bumpers and score tales!</p>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <div class="bg-slate-950 px-4 py-2 rounded-2xl border-2 border-amber-400 text-amber-400 font-black text-sm font-fun">
          SCORE: <span id="pinball-score">14,250</span>
        </div>
        <button onclick="triggerMultiball()" class="clay-btn bg-gradient-to-r from-pink-500 to-amber-400 text-slate-950 font-black text-xs px-3.5 py-2 rounded-xl font-fun">
          ⚡ Multiball Frenzy!
        </button>
      </div>
    </header>

    <!-- Main Pinball Playfield -->
    <main class="relative pinball-table rounded-3xl p-6 sm:p-8 min-h-[500px] flex flex-col justify-between overflow-hidden">
      
      <!-- Top Mushroom Bumpers -->
      <div class="flex justify-around items-center my-4 z-10">
        
        <button onclick="hitBumper(100, 523)" class="w-20 h-20 rounded-full bg-pink-500 border-4 border-pink-300 shadow-2xl flex flex-col items-center justify-center font-black text-xs font-fun hover:scale-110 active:scale-90 transition-transform">
          <span class="text-2xl">🍄</span>
          <span>100 PTS</span>
        </button>

        <button onclick="hitBumper(500, 659)" class="w-24 h-24 rounded-full bg-amber-400 border-4 border-amber-200 shadow-2xl flex flex-col items-center justify-center font-black text-xs text-amber-950 font-fun hover:scale-110 active:scale-90 transition-transform">
          <span class="text-3xl">⭐</span>
          <span>500 PTS</span>
        </button>

        <button onclick="hitBumper(250, 783)" class="w-20 h-20 rounded-full bg-cyan-400 border-4 border-cyan-200 shadow-2xl flex flex-col items-center justify-center font-black text-xs text-cyan-950 font-fun hover:scale-110 active:scale-90 transition-transform">
          <span class="text-2xl">⚡</span>
          <span>250 PTS</span>
        </button>

      </div>

      <!-- Character Drop Targets -->
      <div class="grid grid-cols-4 gap-3 my-4 z-10 max-w-lg mx-auto w-full">
        <button onclick="hitTarget('🦁', 'The Lion & Mouse', 'Mercy & Courage')" class="bg-indigo-900/90 border-2 border-indigo-400 rounded-2xl p-3 flex flex-col items-center font-fun text-xs hover:bg-indigo-800 transition-colors">
          <span class="text-3xl">🦁</span>
          <span class="font-bold text-[10px] mt-1">Lion</span>
        </button>
        <button onclick="hitTarget('🦅', 'Crow & Pitcher', 'Patience & Wit')" class="bg-indigo-900/90 border-2 border-indigo-400 rounded-2xl p-3 flex flex-col items-center font-fun text-xs hover:bg-indigo-800 transition-colors">
          <span class="text-3xl">🦅</span>
          <span class="font-bold text-[10px] mt-1">Crow</span>
        </button>
        <button onclick="hitTarget('🐢', 'Tortoise & Hare', 'Slow & Steady')" class="bg-indigo-900/90 border-2 border-indigo-400 rounded-2xl p-3 flex flex-col items-center font-fun text-xs hover:bg-indigo-800 transition-colors">
          <span class="text-3xl">🐢</span>
          <span class="font-bold text-[10px] mt-1">Tortoise</span>
        </button>
        <button onclick="hitTarget('🦊', 'Fox & Grapes', 'Honesty')" class="bg-indigo-900/90 border-2 border-indigo-400 rounded-2xl p-3 flex flex-col items-center font-fun text-xs hover:bg-indigo-800 transition-colors">
          <span class="text-3xl">🦊</span>
          <span class="font-bold text-[10px] mt-1">Fox</span>
        </button>
      </div>

      <!-- Ball in Motion -->
      <div id="pinball" class="absolute w-8 h-8 rounded-full bg-gradient-to-tr from-slate-200 via-white to-slate-400 border-2 border-slate-500 shadow-2xl pointer-events-none transition-all duration-300" style="bottom: 30px; right: 30px;"></div>

      <!-- Bottom Flippers & Spring Plunger -->
      <div class="flex items-center justify-between bg-slate-900/90 p-4 rounded-2xl border border-indigo-500/50 z-10">
        <!-- Flippers -->
        <div class="flex gap-4">
          <button onclick="flip()" class="clay-btn bg-indigo-600 text-white font-black text-xs px-5 py-3 rounded-2xl font-fun">
            ◀ FLIP LEFT
          </button>
          <button onclick="flip()" class="clay-btn bg-indigo-600 text-white font-black text-xs px-5 py-3 rounded-2xl font-fun">
            FLIP RIGHT ▶
          </button>
        </div>

        <!-- Spring Plunger -->
        <div class="flex flex-col items-center">
          <span class="text-[10px] font-black uppercase text-indigo-300 font-fun mb-1">Spring Plunger</span>
          <button onclick="launchBall()" class="clay-btn bg-rose-500 hover:bg-rose-400 text-white font-black text-xs px-6 py-3 rounded-2xl font-fun flex items-center gap-1.5 shadow-xl">
            <span>🚀</span> LAUNCH BALL!
          </button>
        </div>
      </div>

    </main>

  </div>

  <script>
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function playChime(freq = 523) {
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.36);
      } catch (e) {}
    }

    let score = 14250;
    function hitBumper(pts, freq) {
      playChime(freq);
      score += pts;
      document.getElementById('pinball-score').textContent = score.toLocaleString();
    }

    function launchBall() {
      playChime(300);
      const b = document.getElementById('pinball');
      b.style.transition = 'all 0.5s cubic-bezier(0.1, 0.9, 0.2, 1)';
      b.style.transform = 'translate(-160px, -240px)';
      setTimeout(() => {
        hitBumper(500, 659);
        b.style.transform = 'translate(-80px, -140px)';
      }, 500);
      setTimeout(() => {
        hitBumper(250, 783);
        b.style.transform = 'translate(0px, 0px)';
      }, 1000);
    }

    function hitTarget(icon, title, moral) {
      playChime(880);
      score += 1000;
      document.getElementById('pinball-score').textContent = score.toLocaleString();
      alert(`🎯 TARGET HIT! ${icon} ${title} unlocked! Moral: ${moral}`);
    }

    function flip() {
      playChime(420);
    }

    function triggerMultiball() {
      [523, 659, 783, 1046].forEach((n, i) => setTimeout(() => playChime(n), i * 60));
      alert('💥 MULTIBALL FRENZY! 3 balls launched into play! Disco lights activated!');
    }
  </script>
</body>
</html>
