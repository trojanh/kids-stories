  <!-- Dynamic Base & SPA Path Resolution for /story/:id -->
  <script>
    (function () {
      // 1. Decode query param redirect if routed from GitHub Pages 404.html
      var l = window.location;
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }

      // 2. Set dynamic base href so relative assets (CSS, JS, data, audio) resolve correctly
      var base = document.querySelector('base');
      if (!base) {
        base = document.createElement('base');
        var path = window.location.pathname;
        var storyIdx = path.indexOf('/story/');
        var baseHref = storyIdx !== -1 ? path.substring(0, storyIdx + 1) : (path.endsWith('/') ? path : path + '/');
        baseHref = baseHref.replace(/index\.html\/?$/, '');
        base.href = baseHref;
        document.head.prepend(base);
      }
    })();
  </script>
