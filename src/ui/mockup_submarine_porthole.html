<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TalePickle - The Deep-Sea Submarine & Sonar Abyss</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background: #020617;
      user-select: none;
      overflow-x: hidden;
    }
    h1, h2, h3, h4, button, .font-fun {
      font-family: 'Fredoka', 'Nunito', sans-serif;
    }
    .clay-btn {
      box-shadow: 0 6px 0 rgba(0,0,0,0.4), 0 10px 20px rgba(0,0,0,0.3);
      transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .clay-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.4), 0 4px 6px rgba(0,0,0,0.2);
    }
    
    /* Heavy Brass Porthole */
    .porthole-frame {
      border: 16px solid #D97706;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.9), 0 20px 50px rgba(0,0,0,0.8);
      background: radial-gradient(circle at 40% 30%, #0369A1 0%, #082F49 50%, #020617 100%);
    }
    @keyframes sonar-sweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes jelly-pulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.6)); }
      50% { transform: scale(1.15); filter: drop-shadow(0 0 25px rgba(56, 189, 248, 1)); }
    }
    .sonar-sweeper {
      animation: sonar-sweep 3.5s linear infinite;
    }
    .jelly-glow {
      animation: jelly-pulse 2.5s ease-in-out infinite;
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 p-3 sm:p-6 flex flex-col justify-between">

  <div class="max-w-5xl mx-auto w-full space-y-6">

    <!-- Top Submarine Header -->
    <header class="bg-slate-900/90 backdrop-blur-md px-5 py-3 rounded-3xl border-3 border-amber-600 shadow-2xl flex items-center justify-between flex-wrap gap-3">
      <div class="flex items-center gap-3">
        <a href="redesigns.html" class="clay-btn bg-slate-800 hover:bg-slate-700 text-amber-400 text-xs font-black px-3.5 py-2 rounded-2xl flex items-center gap-1.5 font-fun">
          <span>← Hub</span>
        </a>
        <div class="flex items-center gap-2">
          <span class="text-3xl">🤿</span>
          <div>
            <h1 class="text-xl sm:text-2xl font-black text-amber-400 font-fun leading-tight">Nautilus Porthole & Sonar</h1>
            <p class="text-[11px] text-amber-200 font-semibold">Depth: 1,420 fathoms • Wipe condensation & ping radar!</p>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="pingSonar()" class="clay-btn bg-cyan-400 text-slate-950 font-black text-xs px-4 py-2 rounded-xl font-fun flex items-center gap-1.5">
          <span>📡</span> PING SONAR!
        </button>
        <button onclick="wipeGlass()" class="clay-btn bg-amber-600 text-white font-black text-xs px-3.5 py-2 rounded-xl font-fun flex items-center gap-1">
          <span>🧽</span> Squeegee Glass
        </button>
      </div>
    </header>

    <!-- Main Brass Porthole Window -->
    <main class="relative porthole-frame rounded-full w-full max-w-2xl mx-auto aspect-square p-8 flex flex-col items-center justify-between overflow-hidden">
      
      <!-- Sonar Line Scanner -->
      <div id="sonar-line" class="absolute inset-0 rounded-full border-2 border-cyan-400/30 hidden pointer-events-none">
        <div class="w-1/2 h-full bg-gradient-to-r from-transparent to-cyan-400/30 origin-right sonar-sweeper"></div>
      </div>

      <!-- Condensation Layer -->
      <div id="condensation" class="absolute inset-0 bg-white/20 backdrop-blur-xs pointer-events-none transition-opacity duration-700"></div>

      <!-- Bioluminescent Deep-Sea Fable Creatures -->
      <div class="relative w-full h-full flex items-center justify-around z-10">
        
        <!-- Jellyfish 1 -->
        <div onclick="selectCreature('The Wise Jellyfish', '🪼', 'Kindness in the Deep', 'Even in the darkest ocean depths, a gentle heart shines bright.')" class="cursor-pointer flex flex-col items-center group transform hover:scale-125 transition-transform">
          <div class="text-6xl jelly-glow mb-1">🪼</div>
          <span class="bg-cyan-950/80 text-cyan-300 border border-cyan-400 text-[10px] font-black px-2 py-0.5 rounded-full font-fun">The Wise Jelly</span>
        </div>

        <!-- Sunken Chest -->
        <div onclick="selectCreature('Sunken Treasure of King Midas', '💎', 'Greed & Generosity', 'Gold cannot buy warm hugs or true friends.')" class="cursor-pointer flex flex-col items-center group transform hover:scale-125 transition-transform">
          <div class="text-6xl animate-bounce mb-1">💎</div>
          <span class="bg-amber-950/80 text-amber-300 border border-amber-400 text-[10px] font-black px-2 py-0.5 rounded-full font-fun">Ancient Chest</span>
        </div>

        <!-- Dolphin -->
        <div onclick="selectCreature('The Dolphin & the Monkey', '🐬', 'Truthfulness', 'Do not boast of things you do not know.')" class="cursor-pointer flex flex-col items-center group transform hover:scale-125 transition-transform">
          <div class="text-6xl animate-pulse mb-1">🐬</div>
          <span class="bg-sky-950/80 text-sky-300 border border-sky-400 text-[10px] font-black px-2 py-0.5 rounded-full font-fun">Brave Dolphin</span>
        </div>

      </div>

      <!-- Bottom Porthole HUD Bar -->
      <div class="bg-slate-900/90 backdrop-blur-md p-4 rounded-2xl border border-cyan-500/50 flex items-center justify-between gap-4 w-full z-10 text-xs">
        <div class="flex items-center gap-3">
          <span id="creature-avatar" class="text-3xl">🪼</span>
          <div>
            <h4 id="creature-title" class="font-black text-cyan-300 font-fun text-sm">The Wise Jellyfish</h4>
            <p id="creature-moral" class="text-[11px] text-cyan-100 font-semibold italic">"A gentle heart shines bright."</p>
          </div>
        </div>
        <button onclick="readHydrophone()" class="clay-btn bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-black px-3.5 py-1.5 rounded-xl font-fun">
          🎧 Hydrophone
        </button>
      </div>

    </main>

  </div>

  <script>
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function playSonar() {
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1400, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 1.25);
      } catch (e) {}
    }

    let activeStory = {
      title: 'The Wise Jellyfish',
      moral: 'Even in the darkest ocean depths, a gentle heart shines bright.'
    };

    function selectCreature(title, avatar, theme, moral) {
      playSonar();
      activeStory = { title, moral };
      document.getElementById('creature-avatar').textContent = avatar;
      document.getElementById('creature-title').textContent = title;
      document.getElementById('creature-moral').textContent = `"${moral}"`;
    }

    function pingSonar() {
      playSonar();
      const line = document.getElementById('sonar-line');
      line.classList.remove('hidden');
      setTimeout(() => line.classList.add('hidden'), 3500);
    }

    function wipeGlass() {
      const cond = document.getElementById('condensation');
      cond.style.opacity = '0';
      setTimeout(() => cond.style.opacity = '1', 4000);
    }

    function readHydrophone() {
      playSonar();
      if ('speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance(`Submarine hydrophone audio received: ${activeStory.title}. Moral: ${activeStory.moral}`);
        window.speechSynthesis.speak(u);
      }
    }
  </script>
</body>
</html>
