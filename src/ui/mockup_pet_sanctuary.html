<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TalePickle - The Tamagotchi Living Pet Sanctuary</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background: #ECFDF5;
      user-select: none;
      overflow-x: hidden;
    }
    h1, h2, h3, h4, button, .font-fun {
      font-family: 'Fredoka', 'Nunito', sans-serif;
    }
    .clay-btn {
      box-shadow: 0 6px 0 rgba(0,0,0,0.15), 0 10px 15px rgba(0,0,0,0.08);
      transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .clay-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.15), 0 4px 6px rgba(0,0,0,0.05);
    }
    .meadow-canvas {
      border: 8px solid #34D399;
      box-shadow: inset 0 6px 20px rgba(255,255,255,0.6), 0 20px 40px rgba(5, 150, 105, 0.2);
    }
    @keyframes pet-hop {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    .pet-hopping { animation: pet-hop 2s ease-in-out infinite; }
  </style>
</head>
<body class="min-h-screen text-slate-800 p-3 sm:p-6 flex flex-col justify-between">

  <div class="max-w-5xl mx-auto w-full space-y-6">

    <!-- Top Sanctuary Header -->
    <header class="bg-white/90 backdrop-blur-md px-5 py-3 rounded-3xl border-3 border-emerald-300 shadow-xl flex items-center justify-between flex-wrap gap-3">
      <div class="flex items-center gap-3">
        <a href="redesigns.html" class="clay-btn bg-emerald-100 hover:bg-emerald-200 text-emerald-800 text-xs font-black px-3.5 py-2 rounded-2xl flex items-center gap-1.5 font-fun">
          <span>← Hub</span>
        </a>
        <div class="flex items-center gap-2">
          <span class="text-3xl">🐾🍎</span>
          <div>
            <h1 class="text-xl sm:text-2xl font-black text-emerald-950 font-fun leading-tight">Aesop's Living Pet Meadow</h1>
            <p class="text-[11px] text-emerald-700 font-semibold">Feed apples, tickle bellies, and read stories to level up pets!</p>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="feedApple()" class="clay-btn bg-rose-500 text-white text-xs font-black px-4 py-2 rounded-xl font-fun flex items-center gap-1.5 shadow-rose-500/20">
          <span>🍎</span> Feed Apple
        </button>
        <button onclick="tickleBelly()" class="clay-btn bg-amber-400 text-amber-950 text-xs font-black px-3.5 py-2 rounded-xl font-fun flex items-center gap-1">
          <span>💖</span> Give Hug
        </button>
      </div>
    </header>

    <!-- Main Living Meadow Canvas -->
    <main class="relative meadow-canvas rounded-3xl p-6 sm:p-8 min-h-[480px] bg-gradient-to-b from-sky-200 via-emerald-100 to-emerald-300 flex flex-col justify-between overflow-hidden">
      
      <!-- Sky & Floating Butterfly -->
      <div class="flex justify-between items-start pointer-events-none">
        <span class="text-4xl animate-bounce">⛅</span>
        <span class="text-4xl animate-pulse">🦋</span>
      </div>

      <!-- Roaming Chibi Pets in Meadow -->
      <div class="relative w-full h-44 flex items-end justify-around z-10">
        
        <!-- Pet 1: Leo the Lion -->
        <div id="pet-leo" onclick="selectPet('Leo the Lion', '🦁', 'The Lion and the Mouse', 'Lv. 4 Champion', 'No kindness is ever wasted!')" class="cursor-pointer flex flex-col items-center group transform hover:scale-125 transition-transform">
          <span id="leo-bubble" class="hidden text-xs bg-white text-slate-800 px-3 py-1 rounded-full shadow-lg font-black mb-1 animate-bounce font-fun">Yum! 🍎</span>
          <div class="text-6xl pet-hopping">🦁</div>
          <span class="text-[11px] font-black bg-amber-400 text-amber-950 px-2.5 py-0.5 rounded-full shadow mt-1 font-fun">Leo (Lv. 4 👑)</span>
        </div>

        <!-- Pet 2: Pip the Hare -->
        <div id="pet-pip" onclick="selectPet('Pip the Hare', '🐇', 'The Tortoise and the Hare', 'Lv. 5 Racer', 'Slow and steady wins the race!')" class="cursor-pointer flex flex-col items-center group transform hover:scale-125 transition-transform">
          <span id="pip-bubble" class="hidden text-xs bg-white text-slate-800 px-3 py-1 rounded-full shadow-lg font-black mb-1 animate-bounce font-fun">Zoom! ⚡</span>
          <div class="text-6xl pet-hopping" style="animation-delay: 0.6s;">🐇</div>
          <span class="text-[11px] font-black bg-purple-400 text-purple-950 px-2.5 py-0.5 rounded-full shadow mt-1 font-fun">Pip (Lv. 5 ⚡)</span>
        </div>

        <!-- Pet 3: Shelly the Tortoise -->
        <div id="pet-shelly" onclick="selectPet('Shelly the Tortoise', '🐢', 'The Tortoise and the Hare', 'Lv. 3 Wise Shell', 'Patience outpaces haste.')" class="cursor-pointer flex flex-col items-center group transform hover:scale-125 transition-transform">
          <span id="shelly-bubble" class="hidden text-xs bg-white text-slate-800 px-3 py-1 rounded-full shadow-lg font-black mb-1 animate-bounce font-fun">Steady! 🐢</span>
          <div class="text-6xl pet-hopping" style="animation-delay: 1.2s;">🐢</div>
          <span class="text-[11px] font-black bg-emerald-500 text-white px-2.5 py-0.5 rounded-full shadow mt-1 font-fun">Shelly (Lv. 3 🌟)</span>
        </div>

      </div>

      <!-- Bottom Pet HUD Bar -->
      <div class="bg-white/95 backdrop-blur-md p-5 rounded-3xl border-3 border-emerald-400 shadow-2xl flex flex-wrap items-center justify-between gap-4 z-10">
        <div class="flex items-center gap-4">
          <div id="hud-pet-avatar" class="w-16 h-16 rounded-2xl bg-amber-100 border-2 border-amber-300 flex items-center justify-center text-4xl shadow-md">
            🦁
          </div>
          <div>
            <div class="flex items-center gap-2">
              <span id="hud-pet-title" class="font-black text-slate-800 font-fun text-lg">Leo the Lion</span>
              <span id="hud-pet-level" class="bg-amber-400 text-amber-950 text-[10px] font-black px-2 py-0.5 rounded-full font-fun">Lv. 4 Champion</span>
            </div>
            <p id="hud-pet-fable" class="text-xs text-slate-600 font-semibold mt-0.5">Featured Fable: The Lion and the Mouse</p>
            <p id="hud-pet-moral" class="text-xs text-emerald-700 font-black italic">"No kindness is ever wasted!"</p>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <button onclick="readPetStory()" class="clay-btn bg-emerald-500 hover:bg-emerald-400 text-white font-black text-xs px-4 py-2.5 rounded-2xl flex items-center gap-1.5 font-fun">
            <span>📖</span> Open Story
          </button>
          <button onclick="levelUp()" class="clay-btn bg-amber-400 hover:bg-amber-300 text-amber-950 font-black text-xs px-3.5 py-2.5 rounded-2xl font-fun">
            ⭐ Level Up (+100 XP)
          </button>
        </div>
      </div>

    </main>

  </div>

  <script>
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function playChime(freq = 600) {
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.36);
      } catch (e) {}
    }

    let activePet = {
      name: 'Leo the Lion',
      fable: 'The Lion and the Mouse',
      moral: 'No kindness is ever wasted!'
    };

    function selectPet(name, avatar, fable, level, moral) {
      playChime(660);
      activePet = { name, fable, moral };
      document.getElementById('hud-pet-avatar').textContent = avatar;
      document.getElementById('hud-pet-title').textContent = name;
      document.getElementById('hud-pet-level').textContent = level;
      document.getElementById('hud-pet-fable').textContent = `Featured Fable: ${fable}`;
      document.getElementById('hud-pet-moral').textContent = `"${moral}"`;
    }

    function feedApple() {
      playChime(750);
      const b = document.getElementById('leo-bubble');
      b.classList.remove('hidden');
      setTimeout(() => b.classList.add('hidden'), 2000);
    }

    function tickleBelly() {
      playChime(880);
      const p = document.getElementById('pet-leo');
      p.classList.add('scale-125');
      setTimeout(() => p.classList.remove('scale-125'), 300);
      alert('💖 Leo giggles and rolls on the soft grass! Friendship points increased!');
    }

    function levelUp() {
      [523, 659, 783, 1046].forEach((n, i) => setTimeout(() => playChime(n), i * 70));
      alert('🌟 LEVEL UP! Leo has unlocked the Golden Story Crown 👑!');
    }

    function readPetStory() {
      playChime(500);
      if ('speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance(`Reading fable for ${activePet.name}: ${activePet.fable}. Moral: ${activePet.moral}`);
        window.speechSynthesis.speak(u);
      }
    }
  </script>
</body>
</html>
