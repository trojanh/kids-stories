<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting to Story... | Magic Storybook</title>
  <script>
    // GitHub Pages Single Page App Redirect
    // Handles direct hits & reloads for /story/:id on GitHub Pages
    (function () {
      var pathSegmentsToKeep = 1; // for https://<username>.github.io/<repo-name>/
      var l = window.location;
      var repoSegment = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var route = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~');
      var search = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        repoSegment + '/?/' + route + search + l.hash
      );
    })();
  </script>
</head>
<body>
  <p style="font-family: sans-serif; text-align: center; margin-top: 3rem;">Opening the fable...</p>
</body>
</html>
